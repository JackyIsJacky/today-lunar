<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}關鍵籌碼追蹤演算法{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="bi bi-graph-up-arrow"></i>
                <span>籌碼追蹤</span>
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.path == '/' %}active{% endif %}">
                    <i class="bi bi-speedometer2"></i>
                    <span>市場儀表板</span>
                </a>
                <a href="{{ url_for('screening') }}" class="nav-link {% if request.path == '/screening' %}active{% endif %}">
                    <i class="bi bi-funnel"></i>
                    <span>策略選股</span>
                </a>
                <a href="{{ url_for('backtest') }}" class="nav-link {% if request.path == '/backtest' %}active{% endif %}">
                    <i class="bi bi-rewind"></i>
                    <span>回測中心</span>
                </a>
                <a href="{{ url_for('portfolio') }}" class="nav-link {% if request.path == '/portfolio' %}active{% endif %}">
                    <i class="bi bi-briefcase"></i>
                    <span>虛擬庫存</span>
                </a>
                <a href="{{ url_for('settings') }}" class="nav-link {% if request.path == '/settings' %}active{% endif %}">
                    <i class="bi bi-gear"></i>
                    <span>系統設定</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="status-indicator">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">系統就緒</span>
                </div>
                <div class="last-update" id="lastUpdate">--:--:--</div>
            </div>
        </aside>
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
